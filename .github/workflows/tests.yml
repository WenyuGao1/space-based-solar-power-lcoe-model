name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run numerical and evidence tests
        run: python -m unittest discover -s tests -v

      - name: Run the complete reproducibility pipeline
        run: python analysis/run_full_analysis.py

      - name: Check deterministic analytical artifacts for drift
        run: git diff --exit-code -- data/processed report/final_report_EN.md report/final_report_zh.md report/verification_note.md
